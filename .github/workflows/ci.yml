name: CI

on:
  pull_request:
  push:

jobs:
  docker-image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test downloader login recovery
        run: sh ci/test-downloader-architectures.sh

      - name: Test first-start login
        run: sh ci/test-first-start.sh

      - name: Build image
        run: |
          docker build -t hytale-server:test .

      - name: Test read-only diagnostics
        run: IMAGE_NAME=hytale-server:test sh ci/test-diagnostics.sh

      - name: Run image validation tests
        run: |
          chmod +x ci/test-image.sh
          IMAGE_NAME=hytale-server:test ./ci/test-image.sh

      - name: Run Kubernetes manifest validation tests
        run: |
          chmod +x ci/test-k8s-manifests.sh
          ./ci/test-k8s-manifests.sh

      - name: Test native update application and recovery
        run: IMAGE_NAME=hytale-server:test sh ci/test-native-updates.sh

      - name: Test update restart and graceful shutdown
        run: IMAGE_NAME=hytale-server:test sh ci/test-update-runner.sh

      - name: Check image OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hytale-server:test
          version: v0.76.1
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  arm64-image-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build native ARM64 image
        run: docker build -t hytale-server:test .
      - name: Test read-only diagnostics
        run: IMAGE_NAME=hytale-server:test sh ci/test-diagnostics.sh

      - name: Run image validation tests
        run: IMAGE_NAME=hytale-server:test sh ci/test-image.sh
      - name: Run official downloader without authentication
        run: IMAGE_NAME=hytale-server:test sh ci/test-downloader-smoke.sh
      - name: Check ARM64 image OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hytale-server:test
          version: v0.76.1
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
