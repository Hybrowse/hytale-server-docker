name: Documentation and Helm

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - 'ci/*pages*'
      - 'ci/check-docs.py'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/helm-chart.yml'
      - 'deploy/helm/**'
      - 'scripts/**'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - 'ci/*pages*'
      - 'ci/check-docs.py'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/helm-chart.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release docs follow main; the chart is checked out at its own tag below.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Build documentation and check links
        run: |
          zensical build --clean --strict
          python ci/check-docs.py
      - name: Test shared docs and chart publication
        run: python -m unittest discover -s ci -p 'test_pages.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    needs: check
    runs-on: ubuntu-latest
    # Queue releases as well as docs updates; do not replace a pending release.
    concurrency:
      group: documentation-and-helm-pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: github.event_name == 'release'
        with:
          ref: ${{ github.event.release.tag_name }}
          path: release-source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Build current documentation
        run: |
          zensical build --clean --strict
          python ci/check-docs.py
      - name: Read existing published artifacts
        run: |
          git fetch origin gh-pages
          mkdir .previous-pages
          git archive FETCH_HEAD | tar -x -C .previous-pages
      - name: Assemble docs and preserve Helm repository
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            python ci/build-pages.py --site site --previous .previous-pages --output .pages \
              --chart release-source/deploy/helm/hytale-server --version "$RELEASE_TAG"
          else
            python ci/build-pages.py --site site --previous .previous-pages --output .pages
          fi
      - name: Publish shared Pages contents
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .pages
          publish_branch: gh-pages
          force_orphan: false
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
